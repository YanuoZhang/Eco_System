name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Commitlint (PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --extends @commitlint/config-conventional --from origin/${{ github.event.pull_request.base.ref }} --to HEAD
      - name: Commitlint (push main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --extends @commitlint/config-conventional --from HEAD~1 --to HEAD

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: ecopath-frontend
        run: npm ci
      - name: Lint frontend
        working-directory: ecopath-frontend
        run: npm run lint

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps
        working-directory: ecopath-backend
        run: npm ci
      - name: Lint backend
        working-directory: ecopath-backend
        run: npm run lint

