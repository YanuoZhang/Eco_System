name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [ecopath-frontend, ecopath-backend]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: |
          npm install --frozen-lockfile || npm install
      
      - name: Run tests
        working-directory: ${{ matrix.workspace }}
        run: npm run test
      
      - name: Run lint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

  e2e-tests:
    runs-on: ubuntu-latest
    needs: test-and-lint
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecopath-frontend/package-lock.json
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ecopath-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Install frontend deps
        working-directory: ecopath-frontend
        run: |
          npm install --frozen-lockfile || npm install
      
      - name: Install Playwright browsers
        working-directory: ecopath-frontend
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        working-directory: ecopath-frontend
        run: npm run test:e2e

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      
      - name: Install dependencies
        run: |
          npm install --frozen-lockfile || npm install
      
      - name: Run commitlint
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          npx commitlint -x @commitlint/config-conventional --from origin/${{ github.event.pull_request.base.ref }} --to HEAD

