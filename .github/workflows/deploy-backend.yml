name: Deploy Backend to EC2 (after merge)

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if backend folder changed (only for PRs)
        if: github.event_name == 'pull_request'
        id: check_backend
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "BASE_SHA=$BASE_SHA"
          echo "HEAD_SHA=$HEAD_SHA"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^ecopath-backend/'; then
            echo "BACKEND_CHANGED=true" >> $GITHUB_ENV
          else
            echo "BACKEND_CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Skip if no backend changes
        if: github.event_name == 'pull_request' && env.BACKEND_CHANGED == 'false'
        run: echo "No backend changes detected. Skipping deploy." && exit 0

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy to EC2 via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/Eco_System/ecopath-backend
            git fetch --all
            git reset --hard origin/main
            npm install
            npm run build
            pm2 startOrReload ecosystem.config.js --env production
          EOF
