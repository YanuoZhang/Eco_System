name: Deploy to Vercel via Deploy Hook

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Check if frontend has changed
        id: check_changes
        run: |
          git fetch origin main
          # Check whether the merged diff includes ecopath-frontend/
          if git diff --name-only origin/main^1 origin/main | grep -q '^ecopath-frontend/'; then
            echo "FRONTEND_CHANGED=true" >> $GITHUB_ENV
          else
            echo "No frontend changes. Skipping deploy."
            echo "FRONTEND_CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Exit if no frontend changes
        if: env.FRONTEND_CHANGED == 'false'
        run: exit 0

      - name: Ensure deploy hook is set
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set"; exit 1;
          fi

      - name: Call Vercel Deploy Hook
        run: |
          curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
